<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0e9" />
    <title>AutoLab by AutoMoto · Agentic Vehicle Experience</title>
    <meta
      name="description"
      content="One agent-operable vehicle from configuration through ownership: a live 3D showroom, synchronized digital twin, buyer intelligence, and 16 WebMCP tools."

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Relative URLs resolve against the deployed page for modern crawlers.
         After deploying, set og:url and og:image to absolute URLs so older
         scrapers (Facebook, some chat clients) render the card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AutoLab by AutoMoto" />
    <meta property="og:title" content="AutoLab by AutoMoto" />
    <meta
      property="og:description"
      content="One vehicle. One shared state. From configuration to ownership through 17 page-defined WebMCP tools."
    />
    <meta property="og:image" content="/images/autolab-social-card.webp" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta
      property="og:image:alt"
      content="A code-native Hudian RX2 in a studio showroom render, fitted to published dimensions."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AutoLab by AutoMoto" />
    <meta
      name="twitter:description"
      content="One vehicle. One shared state. From configuration to ownership through 17 page-defined WebMCP tools."
    />
    <meta name="twitter:image" content="/images/autolab-social-card.webp" />
  </head>

    <div id="root"></div>
